<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Bucket</title>
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #1c2420;
        --accent: #0f6b5c;
        --line: #cfc6b6;
        --card: #fffdf8;
        --danger: #9b2c2c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #dde9e4 0, transparent 40%),
          linear-gradient(180deg, #f7f3ea, var(--bg));
        min-height: 100vh;
      }
      main {
        width: min(920px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0 4rem;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 0.35rem;
      }
      p.lead {
        margin: 0 0 2rem;
        color: #44514b;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1.25rem 1.35rem 1.4rem;
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.35rem;
      }
      input[type='text'],
      input[type='file'] {
        width: 100%;
        margin-bottom: 0.9rem;
      }
      input[type='text'] {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
        font: inherit;
      }
      .overwrite {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 1rem;
        font-size: 0.95rem;
      }
      .overwrite input {
        width: auto;
        margin: 0;
      }
      .overwrite label {
        margin: 0;
      }
      button,
      .btn {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 999px;
        padding: 0.55rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button:hover,
      .btn:hover {
        filter: brightness(1.05);
      }
      .btn.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: transparent;
        color: var(--danger);
        border: 1px solid #e2b4b4;
      }
      #result {
        margin-top: 0.9rem;
        min-height: 1.4rem;
        word-break: break-all;
      }
      #result a {
        color: var(--accent);
      }
      .toolbar {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 0.9rem;
      }
      .toolbar input {
        margin: 0;
        flex: 1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.7rem 0.4rem;
        border-top: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        border-top: 0;
        font-size: 0.85rem;
        color: #66736c;
        font-weight: 600;
      }
      .path a {
        color: var(--ink);
        font-weight: 600;
      }
      .status {
        font-size: 0.85rem;
      }
      .status.on {
        color: var(--accent);
      }
      .status.off {
        color: #66736c;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: flex-end;
      }
      .muted {
        color: #66736c;
        font-size: 0.85rem;
      }
      .error {
        color: var(--danger);
      }
      .disabled-row .path a {
        color: #66736c;
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HTML Bucket</h1>
      <p class="lead">Upload an HTML file, set a path, share an internal link.</p>

      <section aria-labelledby="publish-title">
        <h2 id="publish-title">Publish</h2>
        <form id="publish-form">
          <label for="file">HTML file</label>
          <input id="file" name="file" type="file" accept=".html,text/html" required />

          <label for="path">Relative path</label>
          <input
            id="path"
            name="path"
            type="text"
            placeholder="demos/checkout-v2"
            required
          />

          <div class="overwrite">
            <input id="overwrite" name="overwrite" type="checkbox" value="true" />
            <label for="overwrite">覆盖已有路径</label>
          </div>

          <button type="submit">Upload</button>
          <div id="result" aria-live="polite"></div>
        </form>
      </section>

      <section aria-labelledby="library-title">
        <h2 id="library-title">Library</h2>
        <div class="toolbar">
          <input id="filter" type="text" placeholder="Filter by path" />
          <button type="button" id="refresh">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>路径</th>
              <th>状态</th>
              <th>大小</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="pages"></tbody>
        </table>
      </section>
    </main>

    <template id="page-row-template">
      <tr>
        <td class="path"><a href="#"></a></td>
        <td class="status"></td>
        <td class="muted size"></td>
        <td>
          <div class="actions">
            <button type="button" class="btn secondary" data-action="toggle">开启/关闭</button>
            <button type="button" class="btn secondary" data-action="update">更新</button>
            <button type="button" class="btn danger" data-action="delete">删除</button>
          </div>
        </td>
      </tr>
    </template>

    <script>
      const form = document.getElementById('publish-form');
      const result = document.getElementById('result');
      const pagesEl = document.getElementById('pages');
      const filterEl = document.getElementById('filter');
      const rowTemplate = document.getElementById('page-row-template');

      async function loadPages() {
        const q = filterEl.value.trim();
        const url = q ? `/api/pages?q=${encodeURIComponent(q)}` : '/api/pages';
        const res = await fetch(url);
        const pages = await res.json();
        pagesEl.innerHTML = '';

        if (!pages.length) {
          const empty = document.createElement('tr');
          empty.innerHTML = '<td colspan="4" class="muted">暂无页面</td>';
          pagesEl.appendChild(empty);
          return;
        }

        for (const page of pages) {
          const row = rowTemplate.content.firstElementChild.cloneNode(true);
          if (!page.enabled) {
            row.classList.add('disabled-row');
          }

          const link = row.querySelector('.path a');
          link.href = `/${page.path}`;
          link.textContent = `/${page.path}`;

          const status = row.querySelector('.status');
          status.textContent = page.enabled ? '已开启' : '已关闭';
          status.classList.add(page.enabled ? 'on' : 'off');

          row.querySelector('.size').textContent = `${page.size} bytes`;

          const toggleBtn = row.querySelector('[data-action="toggle"]');
          toggleBtn.textContent = page.enabled ? '关闭' : '开启';
          toggleBtn.addEventListener('click', () => togglePage(page.path, !page.enabled));

          row
            .querySelector('[data-action="update"]')
            .addEventListener('click', () => prepareUpdate(page.path));

          row
            .querySelector('[data-action="delete"]')
            .addEventListener('click', () => deletePage(page.path));

          pagesEl.appendChild(row);
        }
      }

      function prepareUpdate(path) {
        document.getElementById('path').value = path;
        document.getElementById('overwrite').checked = true;
        document.getElementById('file').focus();
        result.textContent = `已填入路径 /${path}，请选择新的 HTML 后上传覆盖。`;
        result.classList.remove('error');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function togglePage(path, enabled) {
        const res = await fetch('/api/pages', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, enabled }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.message || '更新状态失败');
          return;
        }
        await loadPages();
      }

      async function deletePage(path) {
        if (!confirm(`确认删除 /${path}？`)) {
          return;
        }
        const res = await fetch(`/api/pages?path=${encodeURIComponent(path)}`, {
          method: 'DELETE',
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.message || '删除失败');
          return;
        }
        await loadPages();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Uploading…';
        result.classList.remove('error');

        const data = new FormData(form);
        const res = await fetch('/api/pages', { method: 'POST', body: data });
        const body = await res.json().catch(() => ({}));

        if (!res.ok) {
          const message = Array.isArray(body.message)
            ? body.message.join(', ')
            : body.message || 'Upload failed';
          result.textContent = message;
          result.classList.add('error');
          return;
        }

        result.innerHTML = `Published: <a href="${body.url}">${body.url}</a>`;
        form.reset();
        await loadPages();
      });

      document.getElementById('refresh').addEventListener('click', loadPages);
      filterEl.addEventListener('input', () => {
        clearTimeout(filterEl._t);
        filterEl._t = setTimeout(loadPages, 200);
      });

      loadPages();
    </script>
  </body>
</html>
