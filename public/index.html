<!doctype html>
<html
  lang="zh-CN"
  data-color-mode="auto"
  data-light-theme="light"
  data-dark-theme="dark"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Bucket</title>
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body class="min-h-screen text-fg-default bg-canvas-subtle">
    <main class="mx-auto w-full max-w-5xl px-4 py-10 sm:px-6">
      <header class="mb-8">
        <h1 class="font-sans text-3xl font-semibold tracking-tight text-fg-default sm:text-4xl">
          HTML Bucket
        </h1>
        <p class="mt-2 text-fg-muted">
          Upload an HTML file, set a path, share an internal link.
        </p>
      </header>

      <section
        aria-labelledby="publish-title"
        class="mb-4 rounded-lg border border-border-default bg-canvas-default p-5 shadow-sm"
      >
        <h2 id="publish-title" class="mb-4 text-xl font-semibold text-fg-default">
          Publish
        </h2>
        <form id="publish-form" class="space-y-3">
          <div>
            <label for="file" class="mb-1 block text-sm font-medium text-fg-default">
              HTML file
            </label>
            <input
              id="file"
              name="file"
              type="file"
              accept=".html,text/html"
              required
              class="block w-full text-sm text-fg-default file:mr-3 file:rounded-md file:border file:border-border-default file:bg-btn-default-bg file:px-3 file:py-1.5 file:text-sm file:font-medium file:text-btn-default-fg"
            />
          </div>

          <div>
            <label for="path" class="mb-1 block text-sm font-medium text-fg-default">
              Relative path
            </label>
            <input
              id="path"
              name="path"
              type="text"
              placeholder="demos/checkout-v2"
              required
              class="w-full rounded-md border border-control-border bg-canvas-default px-3 py-2 text-sm text-fg-default outline-none focus:border-fg-link focus:ring-2 focus:ring-fg-link/30"
            />
          </div>

          <div class="flex items-center gap-2 py-1">
            <input
              id="overwrite"
              name="overwrite"
              type="checkbox"
              value="true"
              class="size-4 rounded border-control-border text-fg-success focus:ring-fg-link"
            />
            <label for="overwrite" class="text-sm text-fg-default">覆盖已有路径</label>
          </div>

          <button
            type="submit"
            class="inline-flex items-center rounded-md border border-btn-primary-border bg-btn-primary-bg px-3.5 py-1.5 text-sm font-medium text-btn-primary-fg hover:bg-btn-primary-bg-hover"
          >
            Upload
          </button>
          <div id="result" class="min-h-5 text-sm text-fg-muted" aria-live="polite"></div>
        </form>
      </section>

      <section
        aria-labelledby="library-title"
        class="rounded-lg border border-border-default bg-canvas-default p-5 shadow-sm"
      >
        <h2 id="library-title" class="mb-4 text-xl font-semibold text-fg-default">
          Library
        </h2>
        <div class="mb-4 flex flex-col gap-2 sm:flex-row">
          <input
            id="filter"
            type="text"
            placeholder="Filter by path"
            class="w-full flex-1 rounded-md border border-control-border bg-canvas-default px-3 py-2 text-sm text-fg-default outline-none focus:border-fg-link focus:ring-2 focus:ring-fg-link/30"
          />
          <button
            type="button"
            id="refresh"
            class="inline-flex items-center justify-center rounded-md border border-btn-default-border bg-btn-default-bg px-3.5 py-1.5 text-sm font-medium text-btn-default-fg hover:bg-canvas-inset"
          >
            Refresh
          </button>
        </div>
        <p id="library-status" class="mb-3 min-h-5 text-sm text-fg-muted" aria-live="polite"></p>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-left text-sm">
            <thead>
              <tr class="border-b border-border-muted text-fg-muted">
                <th class="px-2 py-2 font-semibold">路径</th>
                <th class="px-2 py-2 font-semibold">状态</th>
                <th class="px-2 py-2 font-semibold">大小</th>
                <th class="px-2 py-2 font-semibold text-right">操作</th>
              </tr>
            </thead>
            <tbody id="pages"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="page-row-template">
      <tr class="border-b border-border-muted last:border-b-0">
        <td class="path px-2 py-3">
          <a href="#" class="font-semibold text-fg-link hover:underline"></a>
        </td>
        <td class="status px-2 py-3 text-sm"></td>
        <td class="size px-2 py-3 text-fg-muted"></td>
        <td class="px-2 py-3">
          <div class="actions flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="btn secondary inline-flex items-center rounded-md border border-btn-default-border bg-btn-default-bg px-2.5 py-1 text-xs font-medium text-btn-default-fg hover:bg-canvas-inset"
              data-action="toggle"
            >
              开启/关闭
            </button>
            <button
              type="button"
              class="btn secondary inline-flex items-center rounded-md border border-btn-default-border bg-btn-default-bg px-2.5 py-1 text-xs font-medium text-btn-default-fg hover:bg-canvas-inset"
              data-action="update"
            >
              更新
            </button>
            <button
              type="button"
              class="btn danger inline-flex items-center rounded-md border border-btn-danger-border bg-btn-danger-bg px-2.5 py-1 text-xs font-medium text-btn-danger-fg hover:bg-canvas-inset"
              data-action="delete"
            >
              删除
            </button>
          </div>
        </td>
      </tr>
    </template>

    <script>
      const form = document.getElementById('publish-form');
      const result = document.getElementById('result');
      const pagesEl = document.getElementById('pages');
      const filterEl = document.getElementById('filter');
      const libraryStatus = document.getElementById('library-status');
      const rowTemplate = document.getElementById('page-row-template');
      const updateFileInput = document.createElement('input');
      updateFileInput.type = 'file';
      updateFileInput.accept = '.html,text/html';
      updateFileInput.hidden = true;
      document.body.appendChild(updateFileInput);

      let pendingUpdatePath = null;

      function setLibraryStatus(message, isError = false) {
        libraryStatus.textContent = message;
        libraryStatus.classList.toggle('text-fg-danger', isError);
        libraryStatus.classList.toggle('text-fg-muted', !isError);
      }

      async function loadPages() {
        const q = filterEl.value.trim();
        const url = q ? `/api/pages?q=${encodeURIComponent(q)}` : '/api/pages';
        const res = await fetch(url);
        const pages = await res.json();
        pagesEl.innerHTML = '';

        if (!pages.length) {
          const empty = document.createElement('tr');
          empty.innerHTML =
            '<td colspan="4" class="px-2 py-6 text-center text-fg-muted">暂无页面</td>';
          pagesEl.appendChild(empty);
          return;
        }

        for (const page of pages) {
          const row = rowTemplate.content.firstElementChild.cloneNode(true);
          if (!page.enabled) {
            row.classList.add('opacity-70');
          }

          const link = row.querySelector('.path a');
          link.href = `/${page.path}`;
          link.textContent = `/${page.path}`;
          if (!page.enabled) {
            link.classList.add('line-through', 'text-fg-muted');
            link.classList.remove('text-fg-link');
          }

          const status = row.querySelector('.status');
          status.textContent = page.enabled ? '已开启' : '已关闭';
          status.classList.add(page.enabled ? 'text-fg-success' : 'text-fg-muted');

          row.querySelector('.size').textContent = `${page.size} bytes`;

          const toggleBtn = row.querySelector('[data-action="toggle"]');
          toggleBtn.textContent = page.enabled ? '关闭' : '开启';
          toggleBtn.addEventListener('click', () =>
            togglePage(page.path, !page.enabled),
          );

          row
            .querySelector('[data-action="update"]')
            .addEventListener('click', () => startUpdate(page.path));

          row
            .querySelector('[data-action="delete"]')
            .addEventListener('click', () => deletePage(page.path));

          pagesEl.appendChild(row);
        }
      }

      function startUpdate(path) {
        pendingUpdatePath = path;
        updateFileInput.value = '';
        setLibraryStatus(`选择新的 HTML 以更新 /${path}`);
        updateFileInput.click();
      }

      updateFileInput.addEventListener('change', async () => {
        const path = pendingUpdatePath;
        const file = updateFileInput.files?.[0];
        pendingUpdatePath = null;
        updateFileInput.value = '';

        if (!path || !file) {
          setLibraryStatus('');
          return;
        }

        setLibraryStatus(`正在更新 /${path}…`);
        const data = new FormData();
        data.set('path', path);
        data.set('overwrite', 'true');
        data.set('file', file, file.name);

        const res = await fetch('/api/pages', { method: 'POST', body: data });
        const body = await res.json().catch(() => ({}));

        if (!res.ok) {
          const message = Array.isArray(body.message)
            ? body.message.join(', ')
            : body.message || '更新失败';
          setLibraryStatus(message, true);
          return;
        }

        setLibraryStatus(`已更新 /${path}`);
        await loadPages();
      });

      async function togglePage(path, enabled) {
        const res = await fetch('/api/pages', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, enabled }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.message || '更新状态失败');
          return;
        }
        await loadPages();
      }

      async function deletePage(path) {
        if (!confirm(`确认删除 /${path}？`)) {
          return;
        }
        const res = await fetch(`/api/pages?path=${encodeURIComponent(path)}`, {
          method: 'DELETE',
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.message || '删除失败');
          return;
        }
        await loadPages();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Uploading…';
        result.classList.remove('text-fg-danger');
        result.classList.add('text-fg-muted');

        const data = new FormData(form);
        const res = await fetch('/api/pages', { method: 'POST', body: data });
        const body = await res.json().catch(() => ({}));

        if (!res.ok) {
          const message = Array.isArray(body.message)
            ? body.message.join(', ')
            : body.message || 'Upload failed';
          result.textContent = message;
          result.classList.remove('text-fg-muted');
          result.classList.add('text-fg-danger');
          return;
        }

        result.innerHTML = `Published: <a class="text-fg-link hover:underline" href="${body.url}">${body.url}</a>`;
        form.reset();
        await loadPages();
      });

      document.getElementById('refresh').addEventListener('click', loadPages);
      filterEl.addEventListener('input', () => {
        clearTimeout(filterEl._t);
        filterEl._t = setTimeout(loadPages, 200);
      });

      loadPages();
    </script>
  </body>
</html>
