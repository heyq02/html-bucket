<!doctype html>
<html
  lang="zh-CN"
  data-color-mode="auto"
  data-light-theme="light"
  data-dark-theme="dark"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Bucket</title>
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body class="min-h-screen text-fg-default bg-canvas-subtle">
    <main class="mx-auto w-full max-w-5xl px-4 py-10 sm:px-6">
      <header class="mb-8">
        <h1 class="font-sans text-3xl font-semibold tracking-tight text-fg-default sm:text-4xl">
          HTML Bucket
        </h1>
        <p class="mt-2 text-fg-muted">
          先选择 HTML 文件，再确认相对路径并发布。
        </p>
      </header>

      <section
        aria-labelledby="publish-title"
        class="mb-4 rounded-lg border border-border-default bg-canvas-default p-5 shadow-sm"
      >
        <h2 id="publish-title" class="mb-4 text-xl font-semibold text-fg-default">
          Publish
        </h2>

        <div id="step-pick" class="space-y-3">
          <input
            id="file"
            name="file"
            type="file"
            accept=".html,text/html"
            class="hidden"
          />
          <button
            type="button"
            id="pick-file"
            class="inline-flex cursor-pointer items-center rounded-md border border-btn-primary-border bg-btn-primary-bg px-3.5 py-1.5 text-sm font-medium text-btn-primary-fg hover:bg-btn-primary-bg-hover"
          >
            上传 HTML
          </button>
          <p id="pick-hint" class="text-sm text-fg-muted">点击后选择要发布的 HTML 文件。</p>
        </div>

        <form id="publish-form" class="hidden space-y-3">
          <p class="text-sm text-fg-muted">
            已选择：<span id="selected-name" class="font-medium text-fg-default"></span>
          </p>

          <div>
            <label for="path" class="mb-1 block text-sm font-medium text-fg-default">
              相对路径
            </label>
            <input
              id="path"
              name="path"
              type="text"
              placeholder="demos/checkout-v2"
              required
              class="w-full rounded-md border border-control-border bg-canvas-default px-3 py-2 text-sm text-fg-default outline-none focus:border-fg-link focus:ring-2 focus:ring-fg-link/30"
            />
            <p class="mt-1 text-xs text-fg-muted">默认使用文件名，可修改。</p>
          </div>

          <div class="flex flex-wrap gap-2">
            <button
              type="submit"
              class="inline-flex cursor-pointer items-center rounded-md border border-btn-primary-border bg-btn-primary-bg px-3.5 py-1.5 text-sm font-medium text-btn-primary-fg hover:bg-btn-primary-bg-hover"
            >
              确认发布
            </button>
            <button
              type="button"
              id="repick-file"
              class="inline-flex cursor-pointer items-center rounded-md border border-btn-default-border bg-btn-default-bg px-3.5 py-1.5 text-sm font-medium text-btn-default-fg hover:bg-canvas-inset"
            >
              重新选择
            </button>
          </div>
        </form>

        <div
          id="result"
          class="mt-3 min-h-5 rounded-md px-3 py-2 text-sm text-fg-muted empty:hidden"
          aria-live="polite"
        ></div>

        <div
          id="overwrite-dialog"
          class="mt-3 hidden rounded-md border border-border-default bg-canvas-inset p-4"
          role="dialog"
          aria-labelledby="overwrite-title"
        >
          <p id="overwrite-title" class="text-sm text-fg-default">
            路径 <span id="overwrite-path" class="font-semibold"></span> 已存在，是否覆盖？
          </p>
          <div class="mt-3 flex flex-wrap gap-2">
            <button
              type="button"
              id="overwrite-yes"
              class="inline-flex cursor-pointer items-center rounded-md border border-btn-primary-border bg-btn-primary-bg px-3.5 py-1.5 text-sm font-medium text-btn-primary-fg hover:bg-btn-primary-bg-hover"
            >
              覆盖
            </button>
            <button
              type="button"
              id="overwrite-no"
              class="inline-flex cursor-pointer items-center rounded-md border border-btn-default-border bg-btn-default-bg px-3.5 py-1.5 text-sm font-medium text-btn-default-fg hover:bg-canvas-default"
            >
              取消
            </button>
          </div>
        </div>
      </section>

      <section
        aria-labelledby="library-title"
        class="rounded-lg border border-border-default bg-canvas-default p-5 shadow-sm"
      >
        <h2 id="library-title" class="mb-4 text-xl font-semibold text-fg-default">
          Library
        </h2>
        <div class="mb-4 flex flex-col gap-2 sm:flex-row">
          <input
            id="filter"
            type="text"
            placeholder="Filter by path"
            class="w-full flex-1 rounded-md border border-control-border bg-canvas-default px-3 py-2 text-sm text-fg-default outline-none focus:border-fg-link focus:ring-2 focus:ring-fg-link/30"
          />
          <button
            type="button"
            id="refresh"
            class="inline-flex cursor-pointer items-center justify-center rounded-md border border-btn-default-border bg-btn-default-bg px-3.5 py-1.5 text-sm font-medium text-btn-default-fg hover:bg-canvas-inset"
          >
            Refresh
          </button>
        </div>
        <p
          id="library-status"
          class="mb-3 min-h-5 rounded-md px-3 py-2 text-sm text-fg-muted empty:hidden"
          aria-live="polite"
        ></p>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-left text-sm">
            <thead>
              <tr class="border-b border-border-muted text-fg-muted">
                <th class="px-2 py-2 font-semibold">路径</th>
                <th class="px-2 py-2 font-semibold">状态</th>
                <th class="px-2 py-2 font-semibold">大小</th>
                <th class="px-2 py-2 font-semibold text-right">操作</th>
              </tr>
            </thead>
            <tbody id="pages"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="page-row-template">
      <tr class="border-b border-border-muted last:border-b-0">
        <td class="path px-2 py-3">
          <a href="#" class="font-semibold text-fg-link hover:underline"></a>
        </td>
        <td class="status px-2 py-3 text-sm"></td>
        <td class="size px-2 py-3 text-fg-muted"></td>
        <td class="px-2 py-3">
          <div class="actions flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="btn secondary inline-flex cursor-pointer items-center rounded-md border border-btn-default-border bg-btn-default-bg px-2.5 py-1 text-xs font-medium text-btn-default-fg hover:bg-canvas-inset"
              data-action="toggle"
            >
              开启/关闭
            </button>
            <button
              type="button"
              class="btn secondary inline-flex cursor-pointer items-center rounded-md border border-btn-default-border bg-btn-default-bg px-2.5 py-1 text-xs font-medium text-btn-default-fg hover:bg-canvas-inset"
              data-action="update"
            >
              更新
            </button>
            <button
              type="button"
              class="btn danger inline-flex cursor-pointer items-center rounded-md border border-btn-danger-border bg-btn-danger-bg px-2.5 py-1 text-xs font-medium text-btn-danger-fg hover:bg-canvas-inset"
              data-action="delete"
            >
              删除
            </button>
          </div>
        </td>
      </tr>
    </template>

    <script>
      const stepPick = document.getElementById('step-pick');
      const form = document.getElementById('publish-form');
      const fileInput = document.getElementById('file');
      const pathInput = document.getElementById('path');
      const selectedName = document.getElementById('selected-name');
      const result = document.getElementById('result');
      const pagesEl = document.getElementById('pages');
      const filterEl = document.getElementById('filter');
      const libraryStatus = document.getElementById('library-status');
      const rowTemplate = document.getElementById('page-row-template');

      const updateFileInput = document.createElement('input');
      updateFileInput.type = 'file';
      updateFileInput.accept = '.html,text/html';
      updateFileInput.hidden = true;
      document.body.appendChild(updateFileInput);

      let pendingFile = null;
      let pendingUpdatePath = null;
      let statusTimer = null;
      let knownPaths = new Set();
      let overwriteResolver = null;

      const overwriteDialog = document.getElementById('overwrite-dialog');
      const overwritePathEl = document.getElementById('overwrite-path');

      function askOverwrite(path) {
        return new Promise((resolve) => {
          overwriteResolver = resolve;
          overwritePathEl.textContent = `/${path}`;
          overwriteDialog.classList.remove('hidden');
          document.getElementById('overwrite-yes').focus();
        });
      }

      function closeOverwriteDialog(answer) {
        overwriteDialog.classList.add('hidden');
        if (overwriteResolver) {
          overwriteResolver(answer);
          overwriteResolver = null;
        }
      }

      document
        .getElementById('overwrite-yes')
        .addEventListener('click', () => closeOverwriteDialog(true));
      document
        .getElementById('overwrite-no')
        .addEventListener('click', () => closeOverwriteDialog(false));

      function applyStatusStyles(el, tone) {
        el.classList.remove(
          'text-fg-muted',
          'text-fg-danger',
          'text-fg-success',
          'bg-canvas-inset',
          'bg-btn-danger-bg',
          'border',
          'border-border-muted',
          'border-btn-danger-border',
          'border-fg-success/30',
        );
        if (!el.textContent) {
          return;
        }
        el.classList.add('border');
        if (tone === 'error') {
          el.classList.add(
            'text-fg-danger',
            'bg-btn-danger-bg',
            'border-btn-danger-border',
          );
        } else if (tone === 'success') {
          el.classList.add(
            'text-fg-success',
            'bg-canvas-inset',
            'border-fg-success/30',
          );
        } else {
          el.classList.add('text-fg-muted', 'bg-canvas-inset', 'border-border-muted');
        }
      }

      function normalizeTone(tone) {
        if (tone === true) {
          return 'error';
        }
        if (tone === false || tone == null) {
          return 'info';
        }
        return tone;
      }

      function setResult(message, tone = 'info') {
        tone = normalizeTone(tone);
        result.textContent = message || '';
        applyStatusStyles(result, message ? tone : '');
      }

      function setResultHtml(html, tone = 'success') {
        tone = normalizeTone(tone);
        result.innerHTML = html || '';
        applyStatusStyles(result, html ? tone : '');
      }

      function setLibraryStatus(message, tone = 'info') {
        tone = normalizeTone(tone);
        clearTimeout(statusTimer);
        libraryStatus.textContent = message || '';
        applyStatusStyles(libraryStatus, message ? tone : '');
        if (message && tone === 'success') {
          statusTimer = setTimeout(() => {
            libraryStatus.textContent = '';
            applyStatusStyles(libraryStatus, '');
          }, 3200);
        }
      }

      function defaultPathFromFilename(filename) {
        const base = filename.split(/[/\\]/).pop() || filename;
        return base.replace(/\.html?$/i, '') || base;
      }

      function showPickStep() {
        pendingFile = null;
        fileInput.value = '';
        pathInput.value = '';
        selectedName.textContent = '';
        stepPick.classList.remove('hidden');
        form.classList.add('hidden');
      }

      function showPathStep(file) {
        pendingFile = file;
        selectedName.textContent = file.name;
        pathInput.value = defaultPathFromFilename(file.name);
        stepPick.classList.add('hidden');
        form.classList.remove('hidden');
        pathInput.focus();
        pathInput.select();
      }

      async function publishFile(file, path, overwrite = false) {
        const data = new FormData();
        data.set('path', path);
        data.set('file', file, file.name);
        if (overwrite) {
          data.set('overwrite', 'true');
        }

        const res = await fetch('/api/pages', { method: 'POST', body: data });
        const body = await res.json().catch(() => ({}));
        return { res, body };
      }

      document.getElementById('pick-file').addEventListener('click', () => {
        fileInput.value = '';
        fileInput.click();
      });

      document.getElementById('repick-file').addEventListener('click', () => {
        setResult('');
        fileInput.value = '';
        fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0];
        if (!file) {
          return;
        }
        setResult('');
        showPathStep(file);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!pendingFile) {
          setResult('请先选择 HTML 文件', true);
          showPickStep();
          return;
        }

        const path = pathInput.value.trim();
        if (!path) {
          setResult('请填写相对路径', true);
          return;
        }

        let overwrite = knownPaths.has(path);
        if (overwrite) {
          const shouldOverwrite = await askOverwrite(path);
          if (!shouldOverwrite) {
            setResult('已取消发布，路径未被覆盖', 'info');
            return;
          }
        }

        setResult('发布中…');
        let { res, body } = await publishFile(pendingFile, path, overwrite);

        // Server-side conflict (list may be stale / filtered)
        if (res.status === 409) {
          const shouldOverwrite = await askOverwrite(path);
          if (!shouldOverwrite) {
            setResult('已取消发布，路径未被覆盖', 'info');
            return;
          }
          ({ res, body } = await publishFile(pendingFile, path, true));
        }

        if (!res.ok) {
          const message = Array.isArray(body.message)
            ? body.message.join(', ')
            : body.message || '发布失败';
          setResult(message, 'error');
          return;
        }

        showPickStep();
        filterEl.value = '';
        await loadPages();
        setResultHtml(
          `已发布：<a class="text-fg-link hover:underline" href="/${path}">/${path}</a>`,
          'success',
        );
      });

      async function loadPages() {
        const q = filterEl.value.trim();
        // Always load full path set for overwrite detection, then filter for display
        const allRes = await fetch(`/api/pages?_=${Date.now()}`, {
          cache: 'no-store',
        });
        if (!allRes.ok) {
          throw new Error('加载列表失败');
        }
        const allPages = await allRes.json();
        knownPaths = new Set(allPages.map((page) => page.path));

        const pages = q
          ? allPages.filter((page) => page.path.includes(q))
          : allPages;
        pagesEl.innerHTML = '';

        if (!pages.length) {
          const empty = document.createElement('tr');
          empty.innerHTML =
            '<td colspan="4" class="px-2 py-6 text-center text-fg-muted">暂无页面</td>';
          pagesEl.appendChild(empty);
          return;
        }

        for (const page of pages) {
          const row = rowTemplate.content.firstElementChild.cloneNode(true);
          if (!page.enabled) {
            row.classList.add('opacity-70');
          }

          const link = row.querySelector('.path a');
          link.href = `/${page.path}`;
          link.textContent = `/${page.path}`;
          if (!page.enabled) {
            link.classList.add('line-through', 'text-fg-muted');
            link.classList.remove('text-fg-link');
          }

          const status = row.querySelector('.status');
          status.textContent = page.enabled ? '已开启' : '已关闭';
          status.classList.add(page.enabled ? 'text-fg-success' : 'text-fg-muted');

          row.querySelector('.size').textContent = `${page.size} bytes`;

          const toggleBtn = row.querySelector('[data-action="toggle"]');
          toggleBtn.textContent = page.enabled ? '关闭' : '开启';
          toggleBtn.addEventListener('click', () =>
            togglePage(page.path, !page.enabled),
          );

          row
            .querySelector('[data-action="update"]')
            .addEventListener('click', () => startUpdate(page.path));

          row
            .querySelector('[data-action="delete"]')
            .addEventListener('click', () => deletePage(page.path));

          pagesEl.appendChild(row);
        }
      }

      function startUpdate(path) {
        pendingUpdatePath = path;
        updateFileInput.value = '';
        setLibraryStatus(`请选择新的 HTML 以更新 /${path}`, 'info');
        updateFileInput.click();
      }

      updateFileInput.addEventListener('change', async () => {
        const path = pendingUpdatePath;
        const file = updateFileInput.files?.[0];
        pendingUpdatePath = null;
        updateFileInput.value = '';

        if (!path || !file) {
          setLibraryStatus('已取消更新', 'info');
          return;
        }

        setLibraryStatus(`正在更新 /${path}…`, 'info');
        const { res, body } = await publishFile(file, path, true);

        if (!res.ok) {
          const message = Array.isArray(body.message)
            ? body.message.join(', ')
            : body.message || '更新失败';
          setLibraryStatus(message, 'error');
          return;
        }

        filterEl.value = '';
        await loadPages();
        setLibraryStatus(`已更新 /${path}`, 'success');
      });

      async function togglePage(path, enabled) {
        setLibraryStatus(
          `正在${enabled ? '开启' : '关闭'} /${path}…`,
          'info',
        );
        const res = await fetch('/api/pages', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, enabled }),
          cache: 'no-store',
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          setLibraryStatus(body.message || '更新状态失败', 'error');
          return;
        }
        await loadPages();
        setLibraryStatus(
          `已${enabled ? '开启' : '关闭'} /${path}`,
          'success',
        );
      }

      async function deletePage(path) {
        if (!confirm(`确认删除 /${path}？`)) {
          setLibraryStatus('已取消删除', 'info');
          return;
        }
        setLibraryStatus(`正在删除 /${path}…`, 'info');
        const res = await fetch(`/api/pages?path=${encodeURIComponent(path)}`, {
          method: 'DELETE',
          cache: 'no-store',
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          setLibraryStatus(body.message || '删除失败', 'error');
          return;
        }
        await loadPages();
        setLibraryStatus(`已删除 /${path}`, 'success');
      }

      document.getElementById('refresh').addEventListener('click', async () => {
        try {
          setLibraryStatus('正在刷新列表…', 'info');
          await loadPages();
          setLibraryStatus('列表已刷新', 'success');
        } catch (error) {
          setLibraryStatus(error?.message || '刷新失败', 'error');
        }
      });
      filterEl.addEventListener('input', () => {
        clearTimeout(filterEl._t);
        filterEl._t = setTimeout(() => {
          void loadPages();
        }, 200);
      });

      void loadPages();
    </script>
  </body>
</html>
