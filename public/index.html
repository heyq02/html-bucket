<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Bucket</title>
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #1c2420;
        --accent: #0f6b5c;
        --line: #cfc6b6;
        --card: #fffdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #dde9e4 0, transparent 40%),
          linear-gradient(180deg, #f7f3ea, var(--bg));
        min-height: 100vh;
      }
      main {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0 4rem;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 0.35rem;
      }
      p.lead {
        margin: 0 0 2rem;
        color: #44514b;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1.25rem 1.35rem 1.4rem;
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.35rem;
      }
      input[type='text'],
      input[type='file'] {
        width: 100%;
        margin-bottom: 0.9rem;
      }
      input[type='text'] {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
        font: inherit;
      }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.2rem;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
      #result {
        margin-top: 0.9rem;
        min-height: 1.4rem;
        word-break: break-all;
      }
      #result a {
        color: var(--accent);
      }
      .toolbar {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 0.9rem;
      }
      .toolbar input {
        margin: 0;
        flex: 1;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.65rem 0;
        border-top: 1px solid var(--line);
      }
      li:first-child {
        border-top: 0;
      }
      li a {
        color: var(--ink);
        font-weight: 600;
      }
      .muted {
        color: #66736c;
        font-size: 0.85rem;
      }
      .error {
        color: #9b2c2c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HTML Bucket</h1>
      <p class="lead">Upload an HTML file, set a path, share an internal link.</p>

      <section aria-labelledby="publish-title">
        <h2 id="publish-title">Publish</h2>
        <form id="publish-form">
          <label for="file">HTML file</label>
          <input id="file" name="file" type="file" accept=".html,text/html" required />

          <label for="path">Relative path</label>
          <input
            id="path"
            name="path"
            type="text"
            placeholder="demos/checkout-v2"
            required
          />

          <button type="submit">Upload</button>
          <div id="result" aria-live="polite"></div>
        </form>
      </section>

      <section aria-labelledby="library-title">
        <h2 id="library-title">Library</h2>
        <div class="toolbar">
          <input id="filter" type="text" placeholder="Filter by path" />
          <button type="button" id="refresh">Refresh</button>
        </div>
        <ul id="pages"></ul>
      </section>
    </main>

    <script>
      const form = document.getElementById('publish-form');
      const result = document.getElementById('result');
      const pagesEl = document.getElementById('pages');
      const filterEl = document.getElementById('filter');

      async function loadPages() {
        const q = filterEl.value.trim();
        const url = q ? `/api/pages?q=${encodeURIComponent(q)}` : '/api/pages';
        const res = await fetch(url);
        const pages = await res.json();
        pagesEl.innerHTML = pages
          .map(
            (page) =>
              `<li><a href="/${page.path}">/${page.path}</a><span class="muted">${page.size} bytes</span></li>`,
          )
          .join('');
        if (!pages.length) {
          pagesEl.innerHTML = '<li class="muted">No pages yet.</li>';
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Uploading…';
        result.classList.remove('error');

        const data = new FormData(form);
        const res = await fetch('/api/pages', { method: 'POST', body: data });
        const body = await res.json().catch(() => ({}));

        if (!res.ok) {
          const message = Array.isArray(body.message)
            ? body.message.join(', ')
            : body.message || 'Upload failed';
          result.textContent = message;
          result.classList.add('error');
          return;
        }

        result.innerHTML = `Published: <a href="${body.url}">${body.url}</a>`;
        form.reset();
        await loadPages();
      });

      document.getElementById('refresh').addEventListener('click', loadPages);
      filterEl.addEventListener('input', () => {
        clearTimeout(filterEl._t);
        filterEl._t = setTimeout(loadPages, 200);
      });

      loadPages();
    </script>
  </body>
</html>
